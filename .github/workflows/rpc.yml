name: RPC contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter pub get --directory example/app
      - run: dart format --output=none --set-exit-if-changed lib/query_rpc.dart lib/src/rpc test/rpc test/fixtures/query_rpc test/query/flutter_rpc_read_test.dart example/app/lib/main.dart
      - run: dart analyze lib/query_rpc.dart lib/src/rpc test/rpc test/fixtures/query_rpc test/query/flutter_rpc_read_test.dart example/app/lib/main.dart
      - run: dart test test/rpc
      - run: dart test --platform chrome test/rpc/http_module_test.dart test/rpc/rpc_test.dart test/rpc/client_test.dart test/rpc/query_cancellation_test.dart
      - run: flutter test --no-pub test/query/flutter_rpc_read_test.dart
      - name: Verify native and real browser read consumers
        run: python3 test/support/query_rpc_consumer_smoke.py
