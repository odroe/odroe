name: Published release acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published package version
        type: string
        required: true
      source_commit:
        description: Full reviewed release source commit SHA (S)
        type: string
        required: true
      archive_sha256:
        description: SHA256 of the validated prepublication pub archive
        type: string
        required: true

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          path: release
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.1'
          channel: stable
      - name: Verify acceptance harness regression guards
        run: |
          python3 harness/test/support/release_verify_test.py
          python3 harness/test/support/router_navigation_consumer_smoke_test.py
      - name: Verify the exact official package and its own CLI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.source_commit }}
          HARNESS_COMMIT: ${{ github.sha }}
          RELEASE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          python3 harness/test/support/release_verify.py \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --source-root "$GITHUB_WORKSPACE/release" \
            --harness-commit "$HARNESS_COMMIT" \
            --manifest "$GITHUB_WORKSPACE/harness/test/fixtures/releases/odroe-$RELEASE_VERSION.json" \
            --archive-sha256 "$RELEASE_ARCHIVE_SHA256" \
            --output .odroe/published-release
      - name: Preserve the official release acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release-${{ github.run_id }}
          path: .odroe/published-release/*
          include-hidden-files: true
          if-no-files-found: error
